services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_SCHED_SPREAD=1
    volumes:
      - /mnt/models/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  odysseus:
    build:
      context: ../odysseus
      dockerfile: Dockerfile
    container_name: odysseus
    ports:
      - "3000:7000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - AUTH_ENABLED=true
    volumes:
      - odysseus_data:/app/data
    depends_on:
      - ollama
      - chromadb
    restart: unless-stopped

volumes:
  odysseus_data:
  chroma_data:
